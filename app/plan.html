<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening plan · Zemi-Aku</title>
<meta name="description" content="One town's verdict for one kind of business on one printed page: what the data says, a nearby town to compare, places to visit with their hours, what to check in the field, and what the data cannot tell you.">
<link rel="icon" type="image/png" sizes="32x32" href="/app/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f8f6f4; --sheet: #fff; --ink: #28323c; --ink-2: #505a64; --rule: #28323c; --hair: rgba(40, 50, 60, .16);
    --accent: #5a5aa8; --sans: "Inter", system-ui, sans-serif; --mono: "Fira Code", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); }
  .toolbar { max-width: 8.5in; margin: 0 auto; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font: 13px/1.4 var(--mono); }
  .toolbar a, .toolbar button { font: inherit; color: var(--ink); background: none; border: 1px solid var(--rule); padding: 7px 12px; border-radius: 4px; text-decoration: none; cursor: pointer; }
  .toolbar button { background: var(--ink); color: var(--sheet); }
  .toolbar .home { border: 0; padding-left: 0; margin-right: auto; }
  .sheet { max-width: 8.5in; margin: 0 auto 32px; background: var(--sheet); padding: .55in .6in; box-shadow: 0 1px 4px rgba(0, 0, 0, .08); }
  .kicker { font: 500 11.5px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font: 600 30px/1.1 var(--sans); margin: 4px 0 2px; letter-spacing: -.01em; }
  .made { font: 12px/1.4 var(--mono); color: var(--ink-2); margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1.5px solid var(--rule); }
  #plan { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 26px; }
  #plan > p { grid-column: 1 / -1; }
  #plan > *, .visits li { min-width: 0; overflow-wrap: anywhere; }
  .wide { grid-column: 1 / -1; }
  section, footer { break-inside: avoid; }
  h2 { font: 500 11px/1.2 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--hair); }
  section p { margin: 0 0 6px; }
  .group { font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .small { font-size: 11.5px; color: var(--ink-2); }
  .versus { width: 100%; border-collapse: collapse; font-size: 13px; }
  .versus th, .versus td { text-align: left; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
  .versus thead th { font-weight: 600; }
  .versus td { white-space: nowrap; }
  .versus tbody th { font-weight: 400; color: var(--ink-2); width: 42%; }
  .away { display: block; font: 10.5px/1.3 var(--mono); color: var(--ink-2); font-weight: 400; }
  .visits { margin: 0; padding-left: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 26px; }
  .visits li { font-size: 13px; }
  .visits b, .visits span { display: block; }
  .visits span { color: var(--ink-2); }
  .visits .write { border-bottom: 1px solid var(--hair); height: 22px; color: var(--ink-2); font-size: 11px; padding-top: 4px; }
  .checks { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
  .checks li { position: relative; padding-left: 24px; margin-bottom: 6px; }
  .checks li::before { content: ""; position: absolute; left: 0; top: 2px; width: 13px; height: 13px; border: 1.5px solid var(--ink); border-radius: 2px; }
  footer { display: grid; grid-template-columns: 1.15in 1fr; gap: 18px; align-items: start; border-top: 1.5px solid var(--rule); padding-top: 12px; }
  .qr svg { width: 1.15in; height: 1.15in; display: block; }
  .url { font: 10.5px/1.35 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; margin: 0 0 8px; }
  footer p { margin: 0 0 4px; }
  footer h2 { margin-top: 6px; }
  @media (max-width: 720px) {
    .sheet { padding: 22px 18px; }
    #plan, .visits { grid-template-columns: 1fr; }
    footer { grid-template-columns: 1fr; }
  }
  /* One Letter page: three visit columns, sources in two. */
  @page { size: letter; margin: .4in .45in; }
  @media print {
    body { background: #fff; font-size: 10.5px; line-height: 1.35; }
    .toolbar { display: none; }
    .sheet { max-width: none; margin: 0; padding: 0; box-shadow: none; }
    h1 { font-size: 21px; }
    .made { margin-bottom: 9px; padding-bottom: 7px; }
    #plan { gap: 9px 22px; }
    h2 { font-size: 9px; margin-bottom: 4px; padding-bottom: 3px; }
    .visits { grid-template-columns: 1fr 1fr 1fr; gap: 4px 18px; }
    .visits li, .versus, .checks { font-size: 10px; }
    .visits .write { height: 16px; font-size: 8.5px; padding-top: 2px; }
    .checks li { margin-bottom: 3px; padding-left: 20px; }
    .checks li::before { width: 11px; height: 11px; top: 1px; }
    .versus th, .versus td { padding: 2px 6px 2px 0; }
    footer { grid-template-columns: 1in 1fr; gap: 14px; padding-top: 8px; }
    .qr svg { width: 1in; height: 1in; }
    .small, .url { font-size: 8px; }
    .sources { column-count: 2; column-gap: 18px; }
    .sources p { break-inside: avoid; margin: 0 0 3px; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>
<body>
<nav class="toolbar"><a class="home" href="/">Zemi-Aku</a><a id="other" href="/plan?lang=es">Español</a><a id="map" href="/app">Open on the map</a><button type="button" id="print">Print or save as PDF</button></nav>
<main class="sheet">
  <p class="kicker" id="kicker">Zemi-Aku · Opening plan</p>
  <h1 id="title">Opening plan</h1>
  <p class="made" id="made"></p>
  <div id="plan"></div>
</main>
<script src="/app/vendor/qrcode.js"></script>
<script src="/app/opportunity.js"></script>
<script src="/app/marks.js"></script>
<script src="/app/decision.js"></script>
<script src="/app/plan.js"></script>
</body>
</html>
